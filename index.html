<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131614" media="(prefers-color-scheme: dark)">
<title>N2 Drill Room</title>
<meta name="description" content="JLPT N2 practice: vocabulary, grammar, reading and listening drills with explanations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script>
  // Apply the chosen theme and text size before first paint so the page doesn't flash.
  try {
    const s = JSON.parse(localStorage.getItem("n2p.v1") || "{}").settings || {};
    if (s.theme === "light" || s.theme === "dark") document.documentElement.dataset.theme = s.theme;
    if (s.textSize) document.documentElement.style.setProperty("--text-zoom", s.textSize);
    if (s.textFont) document.documentElement.dataset.font = s.textFont;
  } catch {}
</script>
</head>
<body>
<header class="bar" id="bar">
  <div class="bar-left">
    <button class="bar-back" id="back-btn" type="button" hidden>‹ Back</button>
    <button class="bar-home" id="home-btn" type="button" aria-label="Home">N2 <span>Drill Room</span></button>
  </div>
  <div class="bar-end">
    <div class="bar-right" id="bar-right"></div>
    <button class="bar-theme bar-text" id="text-btn" type="button" aria-label="Text size and font" aria-expanded="false" aria-controls="text-pop">Aa</button>
    <button class="bar-theme" id="theme-btn" type="button"></button>
  </div>
  <div class="text-pop" id="text-pop" role="dialog" aria-label="Text size and font" hidden></div>
</header>
<main id="app" class="wrap" aria-live="polite">
  <p class="loading">問題を読み込んでいます…</p>
</main>
<audio id="player" preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
